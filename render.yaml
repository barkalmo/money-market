services:
  - type: web
    name: money-market
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - { key: NODE_VERSION, value: "20" }
      - { key: SITE_ORIGIN, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: RESEND_API_KEY, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: TALKSASA_API_KEY, sync: false }
      - { key: TALKSASA_SENDER_ID, sync: false }
      - { key: PAYSTACK_SECRET_KEY, sync: false }
